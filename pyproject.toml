[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-client-catalog"
version = "0.1.0"
description = "Track Spiral Knights client versions via Getdown metadata."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.setuptools]
packages = ["catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["catalog", "tests"]
strict = true
warn_unreachable = true
